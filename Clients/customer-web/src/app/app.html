<a class="skip-link sr-only focus:not-sr-only" href="#main-content">{{ 'customer.nav.title' | translate }}</a>
<header class="navbar bg-base-200 px-4" role="banner">
  <div class="flex-1">
    <span class="text-lg font-semibold">{{ 'customer.nav.title' | translate }}</span>
  </div>
  <nav class="flex gap-2 items-center" aria-label="language switch">
    @for (lang of languages; track lang) {
      <button
        type="button"
        class="btn btn-sm btn-ghost"
        [attr.aria-label]="lang"
        (click)="useLanguage(lang)"
      >
        {{ lang.toUpperCase() }}
      </button>
    }
    @if (authState.isAuthenticated()) {
      <span class="text-sm">{{ authState.currentUser()?.displayName }}</span>
      <button type="button" class="btn btn-sm btn-ghost" (click)="logout()">
        {{ 'auth.nav.logout' | translate }}
      </button>
    }
  </nav>
</header>
<main id="main-content" class="container mx-auto p-4">
  <router-outlet />
</main>
