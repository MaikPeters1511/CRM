<section aria-labelledby="smtp-settings-heading" class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">
    <h2 id="smtp-settings-heading" class="card-title">{{ 'settings.smtp.heading' | translate }}</h2>
    <p class="text-sm text-base-content/60 mb-4">{{ 'settings.smtp.hint' | translate }}</p>
    <div class="alert alert-info mb-4" role="status">{{ 'settings.mockupNotice' | translate }}</div>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="form-control">
        <span class="label-text">{{ 'settings.smtp.host' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="host" />
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.smtp.port' | translate }}</span>
        <input type="number" class="input input-bordered w-full" formControlName="port" />
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.smtp.username' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="username" />
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.smtp.senderAddress' | translate }}</span>
        <input type="email" class="input input-bordered w-full" formControlName="senderAddress" />
      </label>
      <label class="label cursor-pointer gap-2 sm:col-span-2">
        <input type="checkbox" class="toggle toggle-primary" formControlName="useSsl" />
        <span class="label-text">{{ 'settings.smtp.useSsl' | translate }}</span>
      </label>

      <div class="sm:col-span-2 flex items-center gap-3 mt-2">
        <button type="submit" class="btn btn-primary">{{ 'settings.actions.save' | translate }}</button>
        @if (savedVisible()) {
          <span class="text-success text-sm" role="status">{{ 'settings.actions.saved' | translate }}</span>
        }
      </div>
    </form>
  </div>
</section>
