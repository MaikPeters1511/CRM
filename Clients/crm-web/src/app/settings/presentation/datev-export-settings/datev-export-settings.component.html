<section aria-labelledby="datev-settings-heading" class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">
    <h2 id="datev-settings-heading" class="card-title">{{ 'settings.datev.heading' | translate }}</h2>
    <p class="text-sm text-base-content/60 mb-4">{{ 'settings.datev.hint' | translate }}</p>
    <div class="alert alert-info mb-4" role="status">{{ 'settings.mockupNotice' | translate }}</div>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="form-control">
        <span class="label-text">{{ 'settings.datev.consultantNumber' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="consultantNumber" />
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.datev.clientNumber' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="clientNumber" />
      </label>
      <label class="form-control sm:col-span-2">
        <span class="label-text">{{ 'settings.datev.exportFormat' | translate }}</span>
        <select class="select select-bordered w-full" formControlName="exportFormat">
          <option value="csv">CSV</option>
          <option value="xml">XML</option>
        </select>
      </label>

      <div class="sm:col-span-2 flex items-center gap-3 mt-2">
        <button type="submit" class="btn btn-primary">{{ 'settings.actions.save' | translate }}</button>
        @if (savedVisible()) {
          <span class="text-success text-sm" role="status">{{ 'settings.actions.saved' | translate }}</span>
        }
      </div>
    </form>
  </div>
</section>
