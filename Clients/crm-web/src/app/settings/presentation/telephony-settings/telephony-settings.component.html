<section aria-labelledby="telephony-settings-heading" class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">
    <h2 id="telephony-settings-heading" class="card-title">{{ 'settings.telephony.heading' | translate }}</h2>
    <p class="text-sm text-base-content/60 mb-4">{{ 'settings.telephony.hint' | translate }}</p>
    <div class="alert alert-info mb-4" role="status">{{ 'settings.mockupNotice' | translate }}</div>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="label cursor-pointer gap-2 sm:col-span-2">
        <input type="checkbox" class="toggle toggle-primary" formControlName="enabled" />
        <span class="label-text">{{ 'settings.telephony.enabled' | translate }}</span>
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.telephony.pbxHost' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="pbxHost" />
      </label>
      <label class="form-control">
        <span class="label-text">{{ 'settings.telephony.extension' | translate }}</span>
        <input type="text" class="input input-bordered w-full" formControlName="extension" />
      </label>
      <label class="form-control sm:col-span-2">
        <span class="label-text">{{ 'settings.telephony.apiKey' | translate }}</span>
        <input type="password" class="input input-bordered w-full" formControlName="apiKey" autocomplete="off" />
      </label>

      <div class="sm:col-span-2 flex items-center gap-3 mt-2">
        <button type="submit" class="btn btn-primary">{{ 'settings.actions.save' | translate }}</button>
        @if (savedVisible()) {
          <span class="text-success text-sm" role="status">{{ 'settings.actions.saved' | translate }}</span>
        }
      </div>
    </form>
  </div>
</section>
